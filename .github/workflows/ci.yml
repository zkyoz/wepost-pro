name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: error
  APP_KEY: ci-test-only-key-32-characters-long
  APP_URL: http://localhost:3333
  SESSION_DRIVER: memory
  SESSION_COOKIE_NAME: wepost_session_ci
  SESSION_COOKIE_DOMAIN: ""
  SESSION_AGE: 15m
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: wepost
  DB_PASSWORD: wepost
  DB_DATABASE: wepost_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  REDIS_SESSION_DB: 14
  REDIS_LIMITER_DB: 15
  REDIS_QUEUE_DB: 13
  REDIS_KEY_PREFIX: wepost:ci
  EMAIL_QUEUE_DRIVER: memory
  EMAIL_QUEUE_NAME: wepost-jobs-ci
  COMMENT_EDIT_WINDOW_MINUTES: 15
  AUTH_LOGIN_RATE_LIMIT: 10
  LIMITER_STORE: memory
  CORS_ORIGINS: http://127.0.0.1:3000
  NUXT_PUBLIC_API_BASE: http://127.0.0.1:3333/api/v1

jobs:
  quality:
    name: Quality, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wepost_test
          POSTGRES_USER: wepost
          POSTGRES_PASSWORD: wepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wepost -d wepost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm api:docs:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: apps/*/coverage
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wepost_test
          POSTGRES_USER: wepost
          POSTGRES_PASSWORD: wepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wepost -d wepost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wepost/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  deployment-rehearsal:
    name: Deployment rehearsal
    runs-on: ubuntu-latest
    needs: [quality, e2e, secret-scan, codeql]
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PORT: 3334
      HOST: 127.0.0.1
      APP_URL: http://127.0.0.1:3334
      GIT_SHA: ${{ github.sha }}
      SESSION_DRIVER: redis
      SESSION_COOKIE_NAME: wepost_session_deployment_rehearsal
      SESSION_COOKIE_DOMAIN: ""
      SESSION_AGE: 15m
      EMAIL_QUEUE_DRIVER: redis
      EMAIL_QUEUE_NAME: wepost-jobs-deployment-rehearsal
      LIMITER_STORE: redis
      REDIS_KEY_PREFIX: wepost:deployment-rehearsal
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wepost_test
          POSTGRES_USER: wepost
          POSTGRES_PASSWORD: wepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wepost -d wepost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the API deployment artifact
        run: pnpm --filter @wepost/api build
      - name: Start the compiled API
        working-directory: apps/api/build
        run: |
          node bin/server.js > /tmp/wepost-api.log 2>&1 &
          echo $! > /tmp/wepost-api.pid
      - name: Wait for the deployed liveness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3334/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wepost-api.log
          exit 1
      - name: Run post-deployment smoke tests
        run: node infra/scripts/smoke-health.mjs http://127.0.0.1:3334
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-rehearsal-logs
          path: /tmp/wepost-api.log
          if-no-files-found: error
          retention-days: 14
