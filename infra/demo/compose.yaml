name: wepost-bc03-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wepost_demo
      POSTGRES_USER: wepost
      POSTGRES_PASSWORD: wepost-demo-local
    ports:
      - "127.0.0.1:5543:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wepost -d wepost_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - demo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  demo_postgres:
  demo_redis:
